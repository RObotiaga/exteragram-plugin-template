name: Skill validation

on:
  pull_request:
    paths:
      - "skills/**"
      - "tools/validate_skill.py"
      - ".github/workflows/skill.yml"
  push:
    branches:
      - master
    paths:
      - "skills/**"
      - "tools/validate_skill.py"
      - ".github/workflows/skill.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill package
        run: python tools/validate_skill.py
